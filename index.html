<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Agent Config Manager - Manage and configure AI agent harnesses and settings" />
    <title>Agent Config Manager</title>
    <style>
      /* Skip to main content link - visible on keyboard focus */
      #skip-to-main {
        position: absolute;
        top: -40px;
        left: 0;
        background: #000;
        color: white;
        padding: 8px;
        text-decoration: none;
        z-index: 100;
        border-radius: 0 0 4px 0;
      }
      #skip-to-main:focus {
        top: 0;
      }
    </style>
    <script>
      // Prevent flash of unstyled content (FOUC) by applying theme before render
      ;(function () {
        try {
          var stored = localStorage.getItem('ui-store')
          if (stored) {
            var state = JSON.parse(stored).state
            var theme = state && state.theme
            if (theme === 'light') {
              document.documentElement.classList.remove('dark')
              document.documentElement.classList.add('light')
            } else if (theme === 'system') {
              var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
              document.documentElement.classList.remove('light', 'dark')
              document.documentElement.classList.add(prefersDark ? 'dark' : 'light')
            }
            // 'dark' is already set as default in HTML
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <!-- Skip to main content link for keyboard users -->
    <a href="#main-content" id="skip-to-main">Skip to main content</a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
